<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A0C10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Desafio 500" />

    <title>Desafio 500 — junte R$ 125.250 riscando um número por vez</title>
    <meta
      name="description"
      content="500 casinhas numeradas de 1 a 500. Guarde o valor, risque o número e junte R$ 125.250 no seu ritmo. Grátis, offline e sem cadastro."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Desafio 500 — junte R$ 125.250" />
    <meta
      property="og:description"
      content="Risque um número por vez e veja o total subir. Grátis, offline e sem cadastro."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Evita o flash de tema errado: aplica a classe antes do React montar.
      ;(function () {
        try {
          var raw = localStorage.getItem('desafio500:state')
          var theme = raw ? JSON.parse(raw).theme : 'system'
          var dark =
            theme === 'dark' ||
            ((theme === 'system' || !theme) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
